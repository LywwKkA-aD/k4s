version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Correctness
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - copyloopvar
    - nakedret

    # Security
    - gosec

    # Style / hygiene
    - revive
    - misspell
    - whitespace
    - prealloc
    - unparam

    # Complexity
    - gocyclo

    # Architecture
    - depguard

  settings:
    depguard:
      rules:
        # Views reach each other only through the messages in
        # internal/tui/views; a direct import couples their models.
        views-no-siblings:
          list-mode: lax
          files:
            - "**/internal/tui/views/*/**"
            # External test packages (package pods_test) import their own view.
            - "!$test"
          deny:
            - pkg: github.com/LywwKkA-aD/k4s/internal/tui/views/
              desc: a view must not import a sibling view; emit a message from internal/tui/views
        # The cluster, command-line, startup, port-forward and log-sink layers
        # stay free of the UI so they test headless and a Charm upgrade does
        # not reach them.
        core-no-ui:
          list-mode: lax
          files:
            - "**/internal/k8s/**"
            - "**/internal/forwards/**"
            - "**/internal/logsink/**"
            - "**/internal/kubectl/**"
            - "**/internal/cli/**"
            - "**/internal/startup/**"
            - "**/internal/cluster/**"
            - "**/internal/sanitize/**"
          deny:
            - pkg: github.com/LywwKkA-aD/k4s/internal/tui
              desc: core packages must not import the TUI
            - pkg: github.com/charmbracelet/
              desc: core packages must not import Charm
            - pkg: charm.land/
              desc: core packages must not import Charm

    gosec:
      excludes:
        # G304: file inclusion via variable. We intentionally accept user-supplied
        # kubeconfig paths in internal/k8s/client.go; the value is supplied by the
        # operator running the tool, not by an untrusted caller.
        - G304
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: var-naming
        - name: unexported-return
        - name: errorf
        - name: indent-error-flow
        - name: superfluous-else

  exclusions:
    rules:
      # Known debt: describe truncates values with ansi.Truncate. Drop this
      # once the truncation moves out of internal/k8s.
      - path: internal/k8s/describe\.go
        linters:
          - depguard
        text: charmbracelet/x/ansi

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/LywwKkA-aD/k4s

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
