apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-greeting
  namespace: k4s-demo
data:
  index.html: |
    <h1>k4s says hi</h1>
    <p>You are looking at one of the nginx replicas.</p>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: k4s-demo
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: greeting
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: greeting
          configMap:
            name: nginx-greeting
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: k4s-demo
  labels:
    app: nginx
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
