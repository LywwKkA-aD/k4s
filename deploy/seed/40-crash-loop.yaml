apiVersion: v1
kind: Pod
metadata:
  name: crash-loop
  namespace: k4s-broken
  labels:
    app: crash-loop
spec:
  restartPolicy: Always
  containers:
    - name: crasher
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "starting up..."
          sleep 5
          echo "intentional failure for k4s status testing"
          exit 1
      resources:
        requests: { cpu: 10m, memory: 8Mi }
        limits:   { cpu: 50m, memory: 32Mi }
